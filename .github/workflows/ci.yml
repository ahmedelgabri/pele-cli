name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # Set explicitly so a missing browser fails the theme tests instead of skipping them.
      PELE_E2E_BROWSER: /usr/bin/google-chrome
    defaults:
      run:
        # Node and pnpm come from the flake, the same versions as the dev shell.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build && pnpm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  # The tests need Node 24+, but package.json promises Node >=22.4, so run the
  # packed CLI on the oldest supported versions.
  node-compat:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.4.0', '22', '24']
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm install --global ./*.tgz
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          pele --version
          printf 'flowchart LR\n  A[Pele] --> B[SVG]\n' > a.mmd
          pele check a.mmd
          # --no-auto-direction uses parseArgs' allowNegative, added in Node 22.4.
          pele render a.mmd --theme auto --max-width 400 --no-auto-direction
          grep -q '<style><!\[CDATA\[' a.svg
          pele types | head -n 1

          expect_exit() {
            local expected=$1
            shift
            set +e
            "$@"
            local actual=$?
            set -e
            if [ "$actual" -ne "$expected" ]; then
              echo "::error::'$*' exited $actual, expected $expected"
              exit 1
            fi
          }
          printf 'flowchart LR\n  A -->\n' > broken.mmd
          expect_exit 1 pele check broken.mmd
          expect_exit 2 pele check --theme dark a.mmd
